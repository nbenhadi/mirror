name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm lint:types

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if echo "$BRANCH" | grep -qE '^(main|staging|develop)$'; then
            echo "Branch '$BRANCH' is a protected integration branch, skipping check."
            exit 0
          fi
          if ! echo "$BRANCH" | grep -qE '^(feat|fix|hotfix|chore|docs|release)/.+'; then
            echo "Branch '$BRANCH' must follow: feat/ fix/ hotfix/ chore/ docs/ release/"
            exit 1
          fi
