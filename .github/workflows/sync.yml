name: Sync

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Open sync PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if git diff --quiet origin/develop origin/main; then
            echo "develop is up to date, nothing to sync"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "chore: sync main into develop" \
            --body "Automated sync after a merge to main." \
            || echo "sync PR already open, skipping"

          PR_NUMBER=$(gh pr list --base develop --head main --json number --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --squash --auto
